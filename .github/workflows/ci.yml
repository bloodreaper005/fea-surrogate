name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The boundary job. `screening.py` is the contract with CAD Agent and claims
  # to be checkable without torch or a mesher; this installs nothing but the
  # base dependencies and holds it to that. It is also the job that stays green
  # in seconds when the model stack is broken, which is when the contract is
  # most worth being able to check.
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install base dependencies only
        run: |
          uv venv --python 3.12
          uv pip install -e . pytest

      - name: Refuse to continue if the model stack leaked into the base install
        run: |
          uv run python - <<'PY'
          import importlib.util, sys
          leaked = [
              name
              for name in ("torch", "gmsh", "scipy", "matplotlib", "torch_geometric")
              if importlib.util.find_spec(name) is not None
          ]
          if leaked:
              sys.exit(
                  "these belong to the inference/render extras but are present "
                  f"in the base install: {leaked}. The contract modules are "
                  "supposed to be usable without them, and this job can no "
                  "longer prove that."
              )
          print("base install is clean")
          PY

      - name: Run what does not need a model
        # Everything else skips itself through importorskip. A skip here is the
        # correct outcome, not a gap: the full job below runs those.
        run: uv run pytest tests -q

      - name: The terminal command starts without the heavy stack
        # `fea-structural --help`, the interview and the screening gate run
        # before anything is meshed; they must work in a base install.
        run: |
          uv run fea-structural --help
          uv run python -m fea_surrogate.cli --help

  # Everything, with the model stack present. Ubuntu only: the risk in this
  # package is the dependency set, not the platform, and the contract job
  # already covers macOS.
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the libraries gmsh's wheel links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libxrender1 libxcursor1 libxinerama1 libxft2

      - name: Install with the inference and render extras
        # CPU torch explicitly. The default index pulls the CUDA build, which is
        # several gigabytes and buys a CPU runner nothing.
        run: |
          uv venv --python 3.12
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install -e ".[inference,render]" pytest

      - name: Run the whole suite, and confirm nothing skipped silently
        # One run, not two: pipefail keeps a failing test fatal through tee.
        # A dependency that fails to install turns the suite green by skipping,
        # which is the failure mode this job exists to catch. The one allowed
        # skip needs the consumer, CAD Agent, which lives in its own repository
        # and is never installed here.
        run: |
          set -o pipefail
          uv run pytest tests -q -rs 2>&1 | tee result.txt
          if grep "^SKIPPED" result.txt | grep -v "consumer not on the path"; then
            echo "::error::a test skipped in the full job; the extras did not install"
            exit 1
          fi

  # The terminal analysis as the README installs it: `.[solve]`, no torch. The
  # suite must pass with the surrogate's tests skipping themselves, and the
  # demo must mesh, solve and draw without the model stack.
  solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the libraries gmsh's wheel links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglu1-mesa libxrender1 libxcursor1 libxinerama1 libxft2

      - name: Install with the solve extra only
        run: |
          uv venv --python 3.12
          uv pip install -e ".[solve]" pytest

      - name: Run the suite without torch
        run: uv run pytest tests -q -rs

      - name: Solve the demo bracket end to end
        run: uv run fea-structural demo --no-open --no-screen --out demo-run
