[project]
name = "fea-surrogate"
version = "0.1.0"
description = "Surrogate screening server emitting SurrogateScreening/v1 for CAD Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.3.0,<2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The model and meshing stack. Kept optional so the contract module, which is
# the part with a consumer on the other side, stays importable without them.
inference = [
    "torch>=2.2",
    "torch-geometric>=2.5",
    "gmsh>=4.12",
]

[dependency-groups]
test = ["pytest>=8.3"]

[project.scripts]
fea-surrogate-mcp = "fea_surrogate.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fea_surrogate"]
